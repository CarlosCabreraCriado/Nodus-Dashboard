<!-- Breadcrumb -->
<div class="breadcrumb-card mb-25 md:flex items-center justify-between">
  <h5 class="mb-0">Courses List</h5>
  <ol class="breadcrumb list-none mt-0 mb-0 pl-0">
    <li class="breadcrumb-item relative">
      <a routerLink="/" class=".inline-block relative">
        <i class="ri-home-8-line"></i>
        Dashboard
      </a>
    </li>
    <li class="breadcrumb-item relative">LMS</li>
    <li class="breadcrumb-item relative">Courses List</li>
  </ol>
</div>

<!-- Courses List -->
<mat-card
  class="daxa-card courses-card mb-25 rounded-xl bg-white border-none block"
  [class.component-dark-theme]="themeService.isDark()"
  [class.rtl-enabled]="themeService.isRTLEnabled()"
>
  <mat-card-header>
    <mat-card-title>
      <h5 class="mb-0">Courses</h5>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-tab-group animationDuration="0ms">
      <mat-tab label="All Courses">
        <app-all-courses />
      </mat-tab>
      <mat-tab label="Paid">
        <app-paid-courses />
      </mat-tab>
      <mat-tab label="Free">
        <app-free-courses />
      </mat-tab>
      <mat-tab label="Top Rated">
        <app-top-rated-courses />
      </mat-tab>
      <mat-tab label="Best Seller">
        <app-best-seller-courses />
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>
