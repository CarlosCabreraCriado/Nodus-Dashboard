<div
  class="stat-item relative"
  [class.rtl-enabled]="themeService.isRTLEnabled()"
  [class.component-dark-theme]="themeService.isDark()"
>
  <h5>Active text-xl font-lights</h5>
  <div class="number text-xl font-lighting-none font-medium">94,817</div>
  <span class="daxa-up-down-badge relative">
    <i class="material-symbols-outlined"> trending_up </i>
    8.75%
  </span>
  <div class="chart">
    <apx-chart
      [series]="chartOptions.series!"
      [chart]="chartOptions.chart!"
      [xaxis]="chartOptions.xaxis!"
      [stroke]="chartOptions.stroke!"
      [dataLabels]="chartOptions.dataLabels!"
      [colors]="chartOptions.colors!"
      [yaxis]="chartOptions.yaxis!"
      [grid]="chartOptions.grid!"
      [labels]="chartOptions.labels!"
      [legend]="chartOptions.legend!"
    ></apx-chart>
    <div class="title block text-body">This Month</div>
  </div>
</div>
