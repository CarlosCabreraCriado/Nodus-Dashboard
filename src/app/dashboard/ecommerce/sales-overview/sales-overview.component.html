<mat-card
  class="daxa-card sales-overview-card mb-25 rounded-xl bg-primary border-none block"
>
  <mat-card-content>
    <h5 class="text-white">Sales Overview</h5>
    <div class="sales-overview-info flex items-center justify-between">
      <div>
        <span class="sub-title block text-white"> Total Sales </span>
        <span
          class="number block text-white font-medium text-xl font-lighting-none"
        >
          9,586
        </span>
      </div>
      <div>
        <span class="sub-title block text-white"> Monthly Sales </span>
        <span
          class="number block text-white font-medium text-xl font-lighting-none"
        >
          3,507
        </span>
      </div>
      <div>
        <span class="sub-title block text-white"> Today’s Sales </span>
        <span
          class="number block text-white font-medium text-xl font-lighting-none"
        >
          357
        </span>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" [style.width.%]="progress"></div>
    </div>
    <span class="info block text-white"> 20% increase in last month </span>
  </mat-card-content>
</mat-card>
