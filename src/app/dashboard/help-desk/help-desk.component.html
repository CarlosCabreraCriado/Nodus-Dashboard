<div class="row">

    <app-tickets-in-progress />

    <app-tickets-resolved />

  <div class="col-md-6 3xl:flex-grow-0 3xl:flex-shrink-0 3xl:w-3/12">

    <app-tickets-closed />

      <div class="col-md-6 lg:flex-grow-0 lg:flex-shrink-0 lg:w-full">

        <app-ave-resolution-time />

    <app-customer-satisfaction />

    <app-tickets-solved-and-cleated />

    <app-tickets-by-channel />

    <app-tickets-by-type />
