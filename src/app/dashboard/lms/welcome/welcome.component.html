<mat-card
  class="daxa-card welcome-card mb-25 rounded-xl relative bg-gradient border-none block"
  [class.rtl-enabled]="themeService.isRTLEnabled()"
>
  <mat-card-content>
    <div class="row">
      <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
        <div class="content">
          <span class="block text-white">
            {{ currentDate }}
          </span>
          <h3 class="text-white">Welcome Back! Daxa</h3>
          <p class="text-white">Learning Management System Dashboard.</p>
          <span class="block text-white font-medium"> Daily Performance </span>
          <div class="chart">
            <apx-chart
              [series]="chartOptions.series!"
              [colors]="chartOptions.colors!"
              [chart]="chartOptions.chart!"
              [plotOptions]="chartOptions.plotOptions!"
              [fill]="chartOptions.fill!"
            ></apx-chart>
          </div>
        </div>
      </div>
      <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
        <div class="image">
          <img src="images/welcome.png" alt="welcome-image" />
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
