<mat-card
  class="daxa-card enrolled-students-card mb-25 rounded-xl bg-white border-none block"
  [class.component-dark-theme]="themeService.isDark()"
>
  <mat-card-content>
    <div class="title">
      <h5>Enrolled Students</h5>
      <div class="number font-medium text-xl font-lighting-none">1.2K</div>
    </div>
    <div class="icon text-center rounded-circle text-white relative">
      <img src="images/icons/join.svg" alt="join-icon" />
    </div>
    <div class="info flex items-center justify-between">
      <span class="sub-title block text-body"> This Week </span>
      <span class="daxa-up-down-badge down relative">
        <i class="material-symbols-outlined"> trending_down </i>
        1.25%
      </span>
    </div>
  </mat-card-content>
</mat-card>
