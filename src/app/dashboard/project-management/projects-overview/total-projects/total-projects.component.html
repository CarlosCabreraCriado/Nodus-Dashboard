<mat-card
  class="daxa-card total-projects-card rounded-xl border-none block"
  [class.component-dark-theme]="themeService.isDark()"
>
  <mat-card-content>
    <div class="flex justify-between">
      <div class="title">
        <h5>Total Projects</h5>
        <div class="number font-medium text-xl font-lighting-none">705</div>
      </div>
      <div class="icon text-center bg-daxa rounded-circle text-white relative">
        <img src="images/icons/total-projects.svg" alt="total-projects-icon" />
      </div>
    </div>
    <div class="info flex items-center justify-between">
      <span class="sub-title block text-body"> Projects this month </span>
      <span class="daxa-up-down-badge relative">
        <i class="material-symbols-outlined"> trending_up </i>
        0.75%
      </span>
    </div>
  </mat-card-content>
</mat-card>
