<mat-card
  class="daxa-card projects-overview-card mb-25 pb-0 rounded-xl bg-white border-none block"
>
  <mat-card-header>
    <mat-card-title>
      <h5 class="mb-0">Projects Overview</h5>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row">
      <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
        <!-- Total Projects -->
        <app-total-projects />
      </div>
      <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
        <!-- Active Projects -->
        <app-active-projects />
      </div>
      <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
        <!-- Completed Projects -->
        <app-completed-projects />
      </div>
      <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
        <!-- Total Members -->
        <app-total-members />
      </div>
    </div>
  </mat-card-content>
</mat-card>
