<!-- Breadcrumb -->
<div class="breadcrumb-card mb-25 md:flex items-center justify-between">
  <h5 class="mb-0">My Profile</h5>
  <ol class="breadcrumb list-none mt-0 mb-0 pl-0">
    <li class="breadcrumb-item relative">
      <a routerLink="/" class=".inline-block relative">
        <i class="ri-home-8-line"></i>
        Dashboard
      </a>
    </li>
    <li class="breadcrumb-item relative">My Profile</li>
  </ol>
</div>

<!-- My Profile -->
<div class="row">
  <div
    class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-full 3xl:flex-grow-0 3xl:flex-shrink-0 3xl:w-6/12"
  >
    <!-- Welcome -->
    <app-welcome />
  </div>
  <div
    class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-full 3xl:flex-grow-0 3xl:flex-shrink-0 3xl:w-6/12"
  >
    <div class="row">
      <div class="col-md-4">
        <!-- Total Projects -->
        <app-total-projects />
      </div>
      <div class="col-md-4">
        <!-- Pending Projects -->
        <app-total-orders />
      </div>
      <div class="col-md-4">
        <!-- Total Revenue -->
        <app-total-revenue />
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div
    class="2xl:flex-grow-0 2xl:flex-shrink-0 2xl:w-4/12 3xl:flex-grow-0 3xl:flex-shrink-0 3xl:w-3/12"
  >
    <!-- Profile Intro -->
    <app-profile-intro />

    <!-- Profile Information -->
    <app-profile-information />

    <!-- Additional Information -->
    <app-additional-information />
  </div>
  <div
    class="2xl:flex-grow-0 2xl:flex-shrink-0 2xl:w-8/12 3xl:flex-grow-0 3xl:flex-shrink-0 3xl:w-9/12"
  >
    <!-- Overview -->
    <app-overview />

    <!-- To Do List -->
    <app-to-do-list />

    <!-- Recent Activity -->
    <app-recent-activity />
  </div>
</div>
