<!-- Breadcrumb -->
<div class="breadcrumb-card mb-25 md: flex items-center justify-between">
  <h5 class="mb-0">Forms Layout</h5>
  <ol class="breadcrumb list-none mt-0 mb-0 pl-0">
    <li class="breadcrumb-item relative">
      <a routerLink="/" class=".inline-block relative">
        <i class="ri-home-8-line"></i>
        Dashboard
      </a>
    </li>
    <li class="breadcrumb-item relative">Forms</li>
    <li class="breadcrumb-item relative">Forms Layout</li>
  </ol>
</div>

<!-- Textual Inputs -->
<mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
  <mat-card-header>
    <mat-card-title>
      <h5 class="mb-0">Textual Inputs</h5>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form>
      <div class="row">
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
          <mat-form-field class="mb-25">
            <mat-label>First Name</mat-label>
            <input matInput placeholder="Ex. Mateo" />
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
          <mat-form-field class="mb-25">
            <mat-label>Last Name</mat-label>
            <input matInput placeholder="Ex. Luca" />
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
          <mat-form-field class="mb-25">
            <mat-label>Email Address</mat-label>
            <input matInput placeholder="Ex. hello@daxa.com" />
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
          <mat-form-field class="mb-25">
            <mat-label>Phone</mat-label>
            <input matInput placeholder="Ex. +098765432" />
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
          <mat-form-field class="mb-25">
            <mat-label>Address</mat-label>
            <input matInput placeholder="Ex. Amsterdam" />
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
          <mat-form-field class="mb-25">
            <mat-label>Country</mat-label>
            <input matInput placeholder="Ex. Netherlands" />
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/3">
          <mat-form-field class="mb-25">
            <mat-label>Town/City</mat-label>
            <mat-select>
              <mat-option value="volvo">New York</mat-option>
              <mat-option value="saab">Amsterdam</mat-option>
              <mat-option value="mercedes">Nalchity</mat-option>
              <mat-option value="audi">Beijing</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/3">
          <mat-form-field class="mb-25">
            <mat-label>State</mat-label>
            <mat-select>
              <mat-option value="volvo">Washington</mat-option>
              <mat-option value="saab">Utah</mat-option>
              <mat-option value="mercedes">Nebraska</mat-option>
              <mat-option value="audi">Florida</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/3">
          <mat-form-field class="mb-25">
            <mat-label>Zip Code</mat-label>
            <input matInput placeholder="Ex. 0986" />
          </mat-form-field>
        </div>
        <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-full">
          <mat-form-field class="textarea">
            <mat-label>Description</mat-label>
            <textarea matInput placeholder="Ex. It makes me feel..."></textarea>
          </mat-form-field>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<!-- Basic Form -->
<div class="row">
  <div class="col-md-6">
    <mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
      <mat-card-header>
        <mat-card-title>
          <h5 class="mb-0">Basic Form</h5>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <app-basic-form />
      </mat-card-content>
    </mat-card>
  </div>
</div>
