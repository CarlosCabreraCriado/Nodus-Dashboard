<!-- Breadcrumb -->
<div class="breadcrumb-card mb-25 md:flex items-center justify-between">
  <h5 class="mb-0">Icon</h5>
  <ol class="breadcrumb list-none mt-0 mb-0 pl-0">
    <li class="breadcrumb-item relative">
      <a routerLink="/" class=".inline-block relative">
        <i class="ri-home-8-line"></i>
        Dashboard
      </a>
    </li>
    <li class="breadcrumb-item relative">UI Elements</li>
    <li class="breadcrumb-item relative">Icon</li>
  </ol>
</div>

<!-- Icon -->
<div class="row">
  <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
    <mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
      <mat-card-header>
        <mat-card-title>
          <h5 class="mb-0">Basic Icons</h5>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-icon
          aria-hidden="false"
          aria-label="Example home icon"
          fontIcon="home"
        ></mat-icon>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="sm:flex-grow-0 sm:flex-shrink-0 sm:w-1/2">
    <mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
      <mat-card-header>
        <mat-card-title>
          <h5 class="mb-0">SVG Icons</h5>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-icon
          svgIcon="thumbs-up"
          aria-hidden="false"
          aria-label="Example thumbs up SVG icon"
        ></mat-icon>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div class="mb-25 text-center">
  <a
    href="https://www.angularjswiki.com/angular/angular-material-icons-list-mat-icon-list/"
    target="_blank"
    mat-flat-button
    class="daxa"
  >
    Click to See More Icon
  </a>
</div>
