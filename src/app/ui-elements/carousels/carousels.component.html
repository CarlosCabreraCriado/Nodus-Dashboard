<!-- Breadcrumb -->
<div class="breadcrumb-card mb-25 md:flex items-center justify-between">
  <h5 class="mb-0">Carousels</h5>
  <ol class="breadcrumb list-none mt-0 mb-0 pl-0">
    <li class="breadcrumb-item relative">
      <a routerLink="/" class=".inline-block relative">
        <i class="ri-home-8-line"></i>
        Dashboard
      </a>
    </li>
    <li class="breadcrumb-item relative">UI Elements</li>
    <li class="breadcrumb-item relative">Carousels</li>
  </ol>
</div>

<!-- Carousels -->
<div class="row">
  <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
    <mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
      <mat-card-header>
        <mat-card-title>
          <h5 class="mb-0">Slides Only</h5>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <owl-carousel-o [options]="imageSlides">
          <ng-template carouselSlide>
            <img src="images/cards/card5.jpg" alt="card" />
          </ng-template>
          <ng-template carouselSlide>
            <img src="images/cards/card6.jpg" alt="card" />
          </ng-template>
        </owl-carousel-o>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
    <mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
      <mat-card-header>
        <mat-card-title>
          <h5 class="mb-0">With Dots Controls</h5>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <owl-carousel-o [options]="imageSlides2">
          <ng-template carouselSlide>
            <img src="images/cards/card6.jpg" alt="card" />
          </ng-template>
          <ng-template carouselSlide>
            <img src="images/cards/card5.jpg" alt="card" />
          </ng-template>
        </owl-carousel-o>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-1/2">
    <mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
      <mat-card-header>
        <mat-card-title>
          <h5 class="mb-0">With Navs Controls</h5>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <owl-carousel-o [options]="imageSlides3">
          <ng-template carouselSlide>
            <img src="images/cards/card6.jpg" alt="card" />
          </ng-template>
          <ng-template carouselSlide>
            <img src="images/cards/card5.jpg" alt="card" />
          </ng-template>
        </owl-carousel-o>
      </mat-card-content>
    </mat-card>
  </div>
  <div class="lg:flex-grow-0 lg:flex-shrink-0 lg:w-full">
    <mat-card class="daxa-card mb-25 rounded-xl bg-white border-none block">
      <mat-card-header>
        <mat-card-title>
          <h5 class="mb-0">Responsive Breakpoints</h5>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <owl-carousel-o [options]="imageSlides4">
          <ng-template carouselSlide>
            <img src="images/cards/card6.jpg" alt="card" />
          </ng-template>
          <ng-template carouselSlide>
            <img src="images/cards/card5.jpg" alt="card" />
          </ng-template>
          <ng-template carouselSlide>
            <img src="images/cards/card6.jpg" alt="card" />
          </ng-template>
          <ng-template carouselSlide>
            <img src="images/cards/card5.jpg" alt="card" />
          </ng-template>
          <ng-template carouselSlide>
            <img src="images/cards/card6.jpg" alt="card" />
          </ng-template>
        </owl-carousel-o>
      </mat-card-content>
    </mat-card>
  </div>
</div>
