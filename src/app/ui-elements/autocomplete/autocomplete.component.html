<!-- Breadcrumb -->
<div class="breadcrumb-card mb-25 md: flex items-center justify-between">
  <h5 class="mb-0">Autocomplete</h5>
  <ol class="breadcrumb list-none mt-0 mb-0 pl-0">
    <li class="breadcrumb-item relative">
      <a routerLink="/" class=".inline-block relative">
        <i class="ri-home-8-line"></i>
        Dashboard
      </a>
    </li>
    <li class="breadcrumb-item relative">UI Elements</li>
    <li class="breadcrumb-item relative">Autocomplete</li>
  </ol>
</div>

<!-- Autocomplete -->
<div class="row">
  <div class="col-lg-6">
    <!-- Simple Autocomplete -->
    <app-simple-autocomplete />
  </div>
  <div class="col-lg-6">
    <!-- Highlight the first Autocomplete Option -->
    <app-highlight-first-option />
  </div>
  <div class="col-lg-6">
    <!-- Display Value Autocomplete -->
    <app-display-value />
  </div>
  <div class="col-lg-6">
    <!-- Filter Autocomplete -->
    <app-filter-options />
  </div>
  <div class="col-lg-6">
    <!-- Option Groups Autocomplete -->
    <app-option-groups />
  </div>
  <div class="col-lg-6">
    <!-- Plain Input Autocomplete -->
    <app-plain-input />
  </div>
  <div class="col-lg-6">
    <!-- Autocomplete Overview -->
    <app-overview />
  </div>
  <div class="col-lg-6">
    <!-- Require an Autocomplete Option to be Selected -->
    <app-require-option-selected />
  </div>
</div>
