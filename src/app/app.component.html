<div
  [ngClass]="{
    'blank-page':
      router.url === '/authentication' ||
      router.url === '/authentication/sign-up' ||
      router.url === '/authentication/forgot-password' ||
      router.url === '/authentication/reset-password' ||
      router.url === '/authentication/lock-screen' ||
      router.url === '/authentication/logout' ||
      router.url === '/authentication/confirm-email' ||
      router.url === '/coming-soon',
  }"
  [class.card-borderd-theme]="themeService.isCardBorder()"
  [class.card-border-radius]="themeService.isCardBorderRadius()"
  [class.rtl-enabled]="themeService.isRTLEnabled()"
>
  <!-- Sidebar -->
  <app-sidebar />

  <!-- Main Content -->
  <div
    class="main-content transition flex flex-col"
    [ngClass]="{ active: isSidebarToggled }"
    [class.right-sidebar]="themeService.isRightSidebar()"
    [class.hide-sidebar]="themeService.isHideSidebar()"
  >
    <app-header />
    <router-outlet />
    <div class="flex-grow"></div>
    <app-footer />
  </div>

  <!-- Customizer Settings -->
  <app-customizer-settings />
  <div
    class="fixed bottom-0 right-0 z-50 bg-red-700 sm:bg-yellow-700 md:bg-purple-500 lg:bg-blue-700 xl:bg-green-700"
  >
    <span class="text-white block sm:hidden">M</span>
    <span class="text-white hidden sm:block md:hidden">SM</span>
    <span class="text-white hidden md:block lg:hidden">MD</span>
    <span class="text-white hidden lg:block xl:hidden">LG</span>
    <span class="text-white hidden xl:block">XL</span>
  </div>
</div>
